<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - Playlists</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --card-hover: #222222;
      --text-main: #f1f1f1;
      --text-muted: #aaa;
      --accent-red: #ff0000;
      --border-color: #272727;
      --font-family: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 50px;
    }

    /* Para Chrome, Safari, Edge e Opera */
    body::-webkit-scrollbar {
      display: none;
    }
    
    /* Para Firefox e IE/Edge antigo */
    body {
      -ms-overflow-style: none;  /* IE e Edge antigo */
      scrollbar-width: none;  /* Firefox */
    }

    /* Topbar */
    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand svg {
      fill: var(--accent-red);
      width: 32px;
      height: 32px;
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Botão Voltar (Estilo YT) */
    .btn-back {
      display: none;
      align-items: center;
      gap: 8px;
      background: #272727;
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #383838;
    }

    .btn-back svg {
      fill: currentColor;
      width: 18px;
      height: 18px;
    }

    .container {
      max-width: 1800px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Cabeçalho da Visão Atual */
    .view-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .view-title svg {
      fill: var(--text-muted);
      width: 24px;
      height: 24px;
    }

    /* Grid Responsivo estilo YouTube */
    .grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
    }

    @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 850px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* Base de Card */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #272727;
      overflow: hidden;
    }

    .card-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Badge de Playlist do YouTube na capa */
    .playlist-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      top: 0;
      width: 40%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      backdrop-filter: blur(2px);
    }

    .playlist-badge svg {
      fill: #fff;
      width: 24px;
      height: 24px;
    }

    /* Conteúdo dos Cards */
    .card-content {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-description {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <button id="btnBack" class="btn-back" onclick="showPlaylistsView()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Voltar para Início
    </button>
    <div class="brand" onclick="showPlaylistsView()">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      <h1>Bookmarks</h1>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status-msg">Carregando dados...</div>
    <div id="viewHeader" class="view-title" style="display: none;"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script>
    const JSON_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/codigos/Bookmarks";
    const BASE_IMAGE_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/imagens/";

    let globalRootLinks = [];  // Guarda os links individuais da pasta raiz (Fast Dial)
    let globalPlaylists = {};  // Guarda os links das subpastas (Documento, Estudo, Plataforma, etc.)

    function getPngImagePath(title) {
      if (!title) return "";
      const fileName = encodeURIComponent(title.trim()) + ".png";
      return BASE_IMAGE_URL + fileName;
    }

    // Processa a árvore JSON específica do Chrome / Fast Dial
    function parseBookmarksTree(data) {
      globalRootLinks = [];
      globalPlaylists = {};

      if (!data || !data.roots) return;

      // Localiza o nó principal ("Fast Dial" ou "bookmark_bar")
      let mainFolder = data.roots.bookmark_bar;
      if (mainFolder && mainFolder.children && mainFolder.children.length > 0) {
        // Se houver uma pasta Fast Dial interna, navega até ela
        const fastDialFolder = mainFolder.children.find(child => child.name === "Fast Dial");
        if (fastDialFolder) {
          mainFolder = fastDialFolder;
        }
      }

      if (!mainFolder || !mainFolder.children) return;

      // Itera sobre os filhos diretos da pasta raiz
      mainFolder.children.forEach(item => {
        // Se for um link direto da raiz, adiciona em globalRootLinks
        if (item.type === "url" || item.url) {
          globalRootLinks.push({
            title: item.name || item.url,
            url: item.url,
            description: item.url
          });
        } 
        // Se for uma subpasta (ex: Documento, Estudo, Plataforma), processa como Playlist
        else if (item.type === "folder" || item.children) {
          const folderName = item.name || "Sem Nome";
          globalPlaylists[folderName] = extractLinksFromFolder(item);
        }
      });
    }

    // Função auxiliar para extrair recursivamente todos os links de uma subpasta
    function extractLinksFromFolder(folderNode) {
      let results = [];
      if (!folderNode.children) return results;

      folderNode.children.forEach(child => {
        if (child.type === "url" || child.url) {
          results.push({
            title: child.name || child.url,
            url: child.url,
            description: child.url
          });
        } else if (child.children) {
          results = results.concat(extractLinksFromFolder(child));
        }
      });

      return results;
    }

    // Helper para gerar o HTML do card de um link individual
    function createIndividualCardHtml(item) {
      const imageUrl = getPngImagePath(item.title);
      const faviconFallback = `https://www.google.com/s2/favicons?domain=${item.url}&sz=128`;

      return `
        <div class="card-thumbnail-wrapper">
          <img class="card-thumbnail" 
               src="${imageUrl}" 
               alt="${item.title}" 
               loading="lazy" 
               onerror="this.onerror=null; this.src='${faviconFallback}';">
        </div>
        <div class="card-content">
          <h2 class="card-title">${item.title}</h2>
          <p class="card-description">${item.description}</p>
        </div>
      `;
    }

    // VISÃO 1: Exibe os links individuais da raiz E os cards de Playlist das subpastas
    function showPlaylistsView() {
      window.location.hash = "";
      document.getElementById("btnBack").style.display = "none";
      
      const viewHeader = document.getElementById("viewHeader");
      viewHeader.style.display = "flex";
      
      const playlistNames = Object.keys(globalPlaylists);
      viewHeader.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        Início (${globalRootLinks.length} Links, ${playlistNames.length} Playlists)
      `;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      // 2. SEGUNDO: Renderiza as SUBPASTAS no formato de Cards de Playlist
      playlistNames.forEach(folderName => {
        const links = globalPlaylists[folderName];
        if (!links || links.length === 0) return;

        const coverImage = getPngImagePath(links[0].title);
        const faviconFallback = `https://www.google.com/s2/favicons?domain=${links[0].url}&sz=128`;

        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => showPlaylistItemsView(folderName);

        card.innerHTML = `
          <div class="card-thumbnail-wrapper">
            <img class="card-thumbnail" 
                 src="${coverImage}" 
                 alt="${folderName}" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='${faviconFallback}';">
            <div class="playlist-badge">
              <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
              <span>${links.length}</span>
            </div>
          </div>
          <div class="card-content">
            <h2 class="card-title">${folderName}</h2>
            <p class="card-description">Playlist • ${links.length} ${links.length === 1 ? 'item' : 'itens'}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      // 1. PRIMEIRO: Renderiza os links soltos da PASTA RAIZ como cards individuais
      globalRootLinks.forEach(item => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = item.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.innerHTML = createIndividualCardHtml(item);
        grid.appendChild(card);
      });
    }

    // VISÃO 2: Exibe os itens de uma Playlist selecionada
    function showPlaylistItemsView(folderName) {
      const links = globalPlaylists[folderName];
      if (!links) return;

      window.location.hash = encodeURIComponent(folderName);
      document.getElementById("btnBack").style.display = "inline-flex";

      const viewHeader = document.getElementById("viewHeader");
      viewHeader.style.display = "flex";
      viewHeader.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        ${folderName}
      `;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      links.forEach(item => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = item.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.innerHTML = createIndividualCardHtml(item);
        grid.appendChild(card);
      });
    }

    async function loadBookmarks() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const rawData = await response.json();
        parseBookmarksTree(rawData);

        status.style.display = "none";

        const initialHash = decodeURIComponent(window.location.hash.replace("#", ""));
        if (initialHash && globalPlaylists[initialHash]) {
          showPlaylistItemsView(initialHash);
        } else {
          showPlaylistsView();
        }

      } catch (error) {
        status.innerHTML = `
          <p style="color: #ff5555;">Erro ao ler os dados do repositório.</p>
          <small>${error.message}</small>
        `;
        console.error(error);
      }
    }

    window.onhashchange = function() {
      const folderName = decodeURIComponent(window.location.hash.replace("#", ""));
      if (folderName && globalPlaylists[folderName]) {
        showPlaylistItemsView(folderName);
      } else {
        showPlaylistsView();
      }
    };

    loadBookmarks();
  </script>
</body>
</html>
