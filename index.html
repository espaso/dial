<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --card-hover: #222222;
      --text-main: #f1f1f1;
      --text-muted: #aaa;
      --accent-red: #ff0000;
      --border-color: #272727;
      --font-family: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 50px;
    }

    /* Header no estilo YouTube */
    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    header svg {
      fill: var(--accent-red);
      width: 32px;
      height: 32px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Seções (Pastas) */
    .folder-section {
      margin-bottom: 40px;
    }

    .folder-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .folder-title svg {
      fill: var(--text-muted);
      width: 20px;
      height: 20px;
    }

    /* Grid Responsivo por Pasta */
    .grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
    }

    @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 850px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* Card */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #272727;
      object-fit: cover;
    }

    .card-content {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-description {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    pre {
      background: #1e1e1e;
      color: #7289da;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      max-height: 300px;
      overflow: auto;
      font-size: 0.85rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <svg viewBox="0 0 24 24">
      <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
    </svg>
    <h1>Bookmarks</h1>
  </header>

  <main class="container" id="content">
    <div id="status" class="status-msg">Carregando links e pastas...</div>
  </main>

  <script>
    const JSON_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/codigos/Bookmarks";
    const BASE_IMAGE_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/imagens/";

    function getPngImagePath(title) {
      if (!title) return "";
      const fileName = encodeURIComponent(title.trim()) + ".png";
      return BASE_IMAGE_URL + fileName;
    }

    // Organiza os bookmarks agrupados por pastas
    function parseFoldersAndBookmarks(node, currentFolder = "Geral", foldersMap = {}) {
      if (!node) return foldersMap;

      // Se for uma lista/array
      if (Array.isArray(node)) {
        node.forEach(item => parseFoldersAndBookmarks(item, currentFolder, foldersMap));
        return foldersMap;
      }

      // Se for um nó de pasta do navegador (ex: Chrome/Firefox/Edge)
      if (node.type === "folder" || (node.children && !node.url && !node.href && !node.link)) {
        const folderName = node.name || node.title || currentFolder;
        if (node.children) {
          node.children.forEach(child => parseFoldersAndBookmarks(child, folderName, foldersMap));
        }
        return foldersMap;
      }

      // Se for um link válido
      const possibleUrl = node.url || node.href || node.link || node.uri || node.URL;
      if (possibleUrl && typeof possibleUrl === 'string' && possibleUrl.startsWith('http')) {
        const title = node.title || node.name || node.label || node.text || possibleUrl;
        const description = node.description || node.desc || possibleUrl;

        if (!foldersMap[currentFolder]) {
          foldersMap[currentFolder] = [];
        }

        foldersMap[currentFolder].push({
          title,
          url: possibleUrl,
          description
        });
        return foldersMap;
      }

      // Se for um objeto contendo chaves que podem ser subpastas ou listas
      if (typeof node === 'object') {
        for (let key in node) {
          if (typeof node[key] === 'object') {
            // Se a chave não for meta-propriedade, usa como nome da pasta
            const nextFolder = (isNaN(key) && key !== 'children' && key !== 'roots') ? key : currentFolder;
            parseFoldersAndBookmarks(node[key], nextFolder, foldersMap);
          }
        }
      }

      return foldersMap;
    }

    async function loadBookmarks() {
      const content = document.getElementById("content");
      const status = document.getElementById("status");

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const rawData = await response.json();
        const foldersMap = parseFoldersAndBookmarks(rawData);

        const folderNames = Object.keys(foldersMap);

        if (folderNames.length === 0) {
          status.innerHTML = `
            <p>Nenhum link ou pasta foi encontrado no arquivo JSON.</p>
            <pre>${JSON.stringify(rawData, null, 2)}</pre>
          `;
          return;
        }

        status.style.display = "none";

        // Renderiza cada pasta como uma seção separada
        folderNames.forEach(folderName => {
          const links = foldersMap[folderName];
          if (!links || links.length === 0) return;

          const section = document.createElement("section");
          section.className = "folder-section";

          const titleEl = document.createElement("h2");
          titleEl.className = "folder-title";
          titleEl.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            ${folderName}
          `;

          const grid = document.createElement("div");
          grid.className = "grid";

          links.forEach(item => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = item.url;
            card.target = "_blank";
            card.rel = "noopener noreferrer";

            const imageUrl = getPngImagePath(item.title);
            const faviconFallback = `https://www.google.com/s2/favicons?domain=${item.url}&sz=128`;

            card.innerHTML = `
              <img class="card-thumbnail" 
                   src="${imageUrl}" 
                   alt="${item.title}" 
                   loading="lazy" 
                   onerror="this.onerror=null; this.src='${faviconFallback}';">
              <div class="card-content">
                <h2 class="card-title">${item.title}</h2>
                <p class="card-description">${item.description}</p>
              </div>
            `;

            grid.appendChild(card);
          });

          section.appendChild(titleEl);
          section.appendChild(grid);
          content.appendChild(section);
        });

      } catch (error) {
        status.innerHTML = `
          <p style="color: #ff5555;">Erro ao ler os dados do repositório.</p>
          <small>${error.message}</small>
        `;
        console.error(error);
      }
    }

    loadBookmarks();
  </script>
</body>
</html>
