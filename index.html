<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --card-hover: #222222;
      --text-main: #f1f1f1;
      --text-muted: #aaa;
      --accent-red: #ff0000;
      --font-family: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #272727;
      z-index: 100;
    }

    header svg {
      fill: var(--accent-red);
      width: 32px;
      height: 32px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
    }

    @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 850px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #272727;
      object-fit: cover;
    }

    .card-content {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-description {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    pre {
      background: #1e1e1e;
      color: #7289da;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      max-height: 300px;
      overflow: auto;
      font-size: 0.85rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <svg viewBox="0 0 24 24">
      <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
    </svg>
    <h1>Bookmarks</h1>
  </header>

  <main class="container">
    <div id="status" class="status-msg">Carregando links...</div>
    <div id="grid" class="grid"></div>
  </main>

  <script>
    const JSON_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/codigos/Bookmarks";

    // Extrai URLs buscando qualquer propriedade comum de link no JSON
    function extractBookmarksUniversal(data) {
      let results = [];

      function search(obj) {
        if (!obj || typeof obj !== 'object') return;

        // Se for um objeto contendo uma URL válida
        const possibleUrl = obj.url || obj.href || obj.link || obj.uri || obj.URL;
        
        if (possibleUrl && typeof possibleUrl === 'string' && possibleUrl.startsWith('http')) {
          const title = obj.title || obj.name || obj.label || obj.text || possibleUrl;
          const image = obj.image || obj.icon || obj.thumbnail || `https://www.google.com/s2/favicons?domain=${possibleUrl}&sz=128`;
          const description = obj.description || obj.desc || possibleUrl;

          results.push({ title, url: possibleUrl, image, description });
        }

        // Se tiver filhos ou for lista/objeto com propriedades internas
        for (let key in obj) {
          if (typeof obj[key] === 'object') {
            search(obj[key]);
          }
        }
      }

      search(data);
      return results;
    }

    async function loadBookmarks() {
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const rawData = await response.json();
        const bookmarks = extractBookmarksUniversal(rawData);

        if (bookmarks.length === 0) {
          status.innerHTML = `
            <p>Nenhum link no formato esperado foi extraído do arquivo.</p>
            <p>Abaixo está o conteúdo recebido do arquivo <code>Bookmarks</code>:</p>
            <pre>${JSON.stringify(rawData, null, 2)}</pre>
          `;
          return;
        }

        status.style.display = "none";

        bookmarks.forEach(item => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = item.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";

          card.innerHTML = `
            <img class="card-thumbnail" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x338/272727/FFFFFF?text=Link'">
            <div class="card-content">
              <h2 class="card-title">${item.title}</h2>
              <p class="card-description">${item.description}</p>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (error) {
        status.innerHTML = `
          <p style="color: #ff5555;">Erro ao acessar ou ler o arquivo do GitHub.</p>
          <small>${error.message}</small>
        `;
        console.error(error);
      }
    }

    loadBookmarks();
  </script>
</body>
</html>
