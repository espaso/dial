<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - Playlists (Exemplo YouTube & OneDrive)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --card-hover: #222222;
      --text-main: #f1f1f1;
      --text-muted: #aaa;
      --accent-red: #ff0000;
      --border-color: #272727;
      --font-family: 'Roboto', sans-serif;
      --badge-youtube: rgba(204, 0, 0, 0.85);
      --badge-onedrive: rgba(0, 120, 212, 1);
      --badge-gdrive: rgba(0, 120, 212, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 50px;
    }

    /* Topbar */
    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand svg {
      fill: var(--accent-red);
      width: 32px;
      height: 32px;
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Botão Voltar (Estilo YT) */
    .btn-back {
      display: none;
      align-items: center;
      gap: 8px;
      background: #272727;
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #383838;
    }

    .btn-back svg {
      fill: currentColor;
      width: 18px;
      height: 18px;
    }

    .container {
      max-width: 1800px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Cabeçalho da Visão Atual */
    .view-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .view-title svg {
      fill: var(--text-muted);
      width: 24px;
      height: 24px;
    }

    /* Grid Responsivo estilo YouTube */
    .grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
    }

    @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 850px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* Base de Card */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #272727;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Badge de Playlist do YouTube na capa */
    .playlist-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      top: 0;
      width: 40%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      backdrop-filter: blur(2px);
    }

    .playlist-badge svg {
      fill: #fff;
      width: 24px;
      height: 24px;
    }

    /* Badge de Origem do Vídeo (YouTube vs OneDrive) */
    .type-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      backdrop-filter: blur(4px);
    }

    .type-tag.youtube {
      background: var(--badge-youtube);
    }

    .type-tag.onedrive {
      background: var(--badge-onedrive);
    }

    .type-tag.gdrive {
      background: var(--badge-gdrive);
    }

    .type-tag svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Conteúdo dos Cards */
    .card-content {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-description {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <button id="btnBack" class="btn-back" onclick="showPlaylistsView()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Voltar para Playlists
    </button>
    <div class="brand" onclick="showPlaylistsView()">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      <h1>Bookmarks</h1>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status-msg">Carregando dados...</div>
    <div id="viewHeader" class="view-title" style="display: none;"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script>
    const JSON_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/codigos/Bookmarks";
    const BASE_IMAGE_URL = "https://raw.githubusercontent.com/espaso/dial/refs/heads/gh-pages/imagens/";

    let globalFoldersData = {};

    function getPngImagePath(title) {
      if (!title) return "";
      const fileName = encodeURIComponent(title.trim()) + ".png";
      return BASE_IMAGE_URL + fileName;
    }

    function getYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function getVideoSourceType(url) {
      if (!url) return 'other';
      const u = url.toLowerCase();
      if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
      if (u.includes('onedrive.live.com') || u.includes('1drv.ms') || u.includes('sharepoint.com')) return 'onedrive';
      if (u.includes('drive.google.com') || u.includes('google.com')) return 'gdrive';
      return 'other';
    }

    function getThumbnailUrl(title, url) {
      const type = getVideoSourceType(url);
      if (type === 'youtube') {
        const ytId = getYouTubeId(url);
        if (ytId) {
          return `https://i.ytimg.com/vi/${ytId}/mqdefault.jpg`;
        }
      }
      return getPngImagePath(title);
    }

    function parseFoldersAndBookmarks(node, currentFolder = "Geral", foldersMap = {}) {
      if (!node) return foldersMap;

      if (Array.isArray(node)) {
        node.forEach(item => parseFoldersAndBookmarks(item, currentFolder, foldersMap));
        return foldersMap;
      }

      if (node.type === "folder" || (node.children && !node.url && !node.href && !node.link)) {
        const folderName = node.name || node.title || currentFolder;
        if (node.children) {
          node.children.forEach(child => parseFoldersAndBookmarks(child, folderName, foldersMap));
        }
        return foldersMap;
      }

      const possibleUrl = node.url || node.href || node.link || node.uri || node.URL;
      if (possibleUrl && typeof possibleUrl === 'string' && possibleUrl.startsWith('http')) {
        const title = node.title || node.name || node.label || node.text || possibleUrl;
        const description = node.description || node.desc || possibleUrl;

        if (!foldersMap[currentFolder]) {
          foldersMap[currentFolder] = [];
        }

        foldersMap[currentFolder].push({
          title,
          url: possibleUrl,
          description
        });
        return foldersMap;
      }

      if (typeof node === 'object') {
        for (let key in node) {
          if (typeof node[key] === 'object') {
            const nextFolder = (isNaN(key) && key !== 'children' && key !== 'roots') ? key : currentFolder;
            parseFoldersAndBookmarks(node[key], nextFolder, foldersMap);
          }
        }
      }

      return foldersMap;
    }

    // VISÃO 1: Lista todas as Pastas no formato de Cards de Playlist
    function showPlaylistsView() {
      window.location.hash = "";
      document.getElementById("btnBack").style.display = "none";
      
      const viewHeader = document.getElementById("viewHeader");
      viewHeader.style.display = "flex";
      viewHeader.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        Playlists (${Object.keys(globalFoldersData).length})
      `;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      Object.keys(globalFoldersData).forEach(folderName => {
        const links = globalFoldersData[folderName];
        if (!links || links.length === 0) return;

        const coverImage = getThumbnailUrl(links[0].title, links[0].url);
        const faviconFallback = `https://www.google.com/s2/favicons?domain=${links[0].url}&sz=128`;

        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => showPlaylistItemsView(folderName);

        card.innerHTML = `
          <div class="card-thumbnail-wrapper">
            <img class="card-thumbnail" 
                 src="${coverImage}" 
                 alt="${folderName}" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='${faviconFallback}';">
            <div class="playlist-badge">
              <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
              <span>${links.length}</span>
            </div>
          </div>
          <div class="card-content">
            <h2 class="card-title">${folderName}</h2>
            <p class="card-description">Playlist • ${links.length} ${links.length === 1 ? 'item' : 'itens'}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // VISÃO 2: Lista os Links/Cards da Playlist Selecionada
    function showPlaylistItemsView(folderName) {
      const links = globalFoldersData[folderName];
      if (!links) return;

      window.location.hash = encodeURIComponent(folderName);
      document.getElementById("btnBack").style.display = "inline-flex";

      const viewHeader = document.getElementById("viewHeader");
      viewHeader.style.display = "flex";
      viewHeader.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        ${folderName}
      `;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      links.forEach(item => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = item.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        const sourceType = getVideoSourceType(item.url);
        const imageUrl = getThumbnailUrl(item.title, item.url);
        const faviconFallback = `https://www.google.com/s2/favicons?domain=${item.url}&sz=128`;

        let typeBadgeHtml = '';

if (sourceType === 'youtube') {
  typeBadgeHtml = `
    <div class="type-tag youtube">
      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      YouTube
    </div>`;
} else if (sourceType === 'onedrive') {
  typeBadgeHtml = `
    <div class="type-tag onedrive">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
      OneDrive
    </div>`;
} else if (sourceType === 'gdrive') {
  typeBadgeHtml = `
    <div class="type-tag gdrive">
      <svg viewBox="0 0 24 24"><path d="M7.71 3.5L1.15 15l3.43 6 6.56-11.5zM9.73 15L6.3 21h13.13l3.43-6zm5.14-11.5h-6.86l6.57 11.5 6.85.01z"/></svg>
      Google Drive
    </div>`;
}
//alert(sourceType);

        card.innerHTML = `
          <div class="card-thumbnail-wrapper">
            <img class="card-thumbnail" 
                 src="${imageUrl}" 
                 alt="${item.title}" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='${faviconFallback}';">
            ${typeBadgeHtml}
          </div>
          <div class="card-content">
            <h2 class="card-title">${item.title}</h2>
            <p class="card-description">${item.description}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function loadBookmarks() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const rawData = await response.json();
        const parsedData = parseFoldersAndBookmarks(rawData);

        // EXEMPLOS ADICIONADOS EXPLICITAMENTE:
        // Injeta uma pasta de exemplo com um vídeo do YouTube e um do OneDrive
        parsedData["Exemplo: Vídeos Diversos"] = [
          {
            title: "Exemplo YouTube: Curso de JavaScript em 10 Minutos",
            //url: "https://www.youtube.com/embed/513Z-EIOeqo",
            url: "https://www.youtube.com/watch?v=UGSlHwsLq0w&list=PLol1cHH7hs1u7KTOcsQ-SwnJn9mrJDdjW",
            description: "Vídeo do YouTube demonstrando o card com capa do YouTube."
          },
          {
            title: "Exemplo OneDrive: Gravação da Reunião de Treinamento",
            //url: "https://1drv.ms/v/c/7b19b5cbe8279a27/IQB22lBqeIK3SohUlBNxuIixAZbTl0u8DrDHTJLyiFjVK_8",
            //url: "https://1drv.ms/v/c/7b19b5cbe8279a27/IQR22lBqeIK3SohUlBNxuIixASncw3ctO-zk75sNVdBeqCY",
            url: "https://onedrive.live.com/embed?cid=7b19b5cbe8279a27&id=7B19B5CBE8279A27!s6a50da7682784ab78854941371b888b1&resid=7B19B5CBE8279A27!s6a50da7682784ab78854941371b888b1&ithint=video,mp4&embed=1&migratedtospo=true&redeem=aHR0cHM6Ly8xZHJ2Lm1zL3YvYy83YjE5YjVjYmU4Mjc5YTI3L0lRUjIybEJxZUlLM1NvaFVsQk54dUlpeEFTbmN3M2N0Ty16azc1c05WZEJlcUNZ",
            //url: "https://onedrive.live.com/embed?resid=SEU_ID_DO_ARQUIVO&authkey=!SUA_CHAVE_AQUI",
            description: "Vídeo do OneDrive demonstrando o card com ícone e badge do OneDrive."
          },
          {
            title: "Exemplo Google Drive: Gravação da Reunião de Treinamento",
            url: "https://drive.google.com/file/d/1SfSF4rlnMq2DkecptVGpWWoUPvaQ5eXh/preview",
            description: "Vídeo do Google Drive demonstrando o card com ícone e badge do OneDrive."
          }
       ];

        globalFoldersData = parsedData;
        status.style.display = "none";

        const initialHash = decodeURIComponent(window.location.hash.replace("#", ""));
        if (initialHash && globalFoldersData[initialHash]) {
          showPlaylistItemsView(initialHash);
        } else {
          showPlaylistsView();
        }

      } catch (error) {
        // Fallback local caso o JSON remoto falhe
        globalFoldersData = {
          "Exemplo: Vídeos Diversos": [
            {
              title: "Exemplo YouTube: Curso de JavaScript",
              url: "https://www.youtube.com/watch?v=513Z-EIOeqo",
              description: "Vídeo hospedado no YouTube."
            },
            {
              title: "Exemplo OneDrive: Gravação de Reunião",
              url: "https://onedrive.live.com/embed?resid=SEU_ID_DO_ARQUIVO&authkey=!SUA_CHAVE_AQUI",
              description: "Vídeo hospedado no OneDrive."
            }
          ]
        };

        status.style.display = "none";
        
        const initialHash = decodeURIComponent(window.location.hash.replace("#", ""));
        if (initialHash && globalFoldersData[initialHash]) {
          showPlaylistItemsView(initialHash);
        } else {
          showPlaylistsView();
        }
      }
    }

    window.onhashchange = function() {
      const folderName = decodeURIComponent(window.location.hash.replace("#", ""));
      if (folderName && globalFoldersData[folderName]) {
        showPlaylistItemsView(folderName);
      } else {
        showPlaylistsView();
      }
    };

    loadBookmarks();
  </script>
</body>
</html>
